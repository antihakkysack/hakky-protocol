# Hakky Protocol — server stack (run on the Hetzner box from this folder).
# Brings up Postgres, the read API, and Caddy (auto-HTTPS reverse proxy).
#
# Secrets are split per service. ../services/.env holds only shared, non-secret
# settings; each write service additionally reads its own .env.<role> file holding
# that role's signing key and nothing else.
#
# The api container deliberately receives no signer file. It is the only published
# port and the public HTTPS origin, so an environment dump there must not surrender
# any signing key. A live process refuses to start holding a key it does not own.
#
#   ../services/.env                 shared, no signing keys
#   ../services/.env.attestation     ATTESTATION_SIGNER_PRIVATE_KEY
#   ../services/.env.reserve-oracle  RESERVE_ORACLE_SIGNER_PRIVATE_KEY
#   ../services/.env.orchestrator    ORCHESTRATOR_SIGNER_PRIVATE_KEY

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hakky
      POSTGRES_PASSWORD: hakky
      POSTGRES_DB: hakky
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hakky"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port — Postgres stays internal to the compose network.

  api:
    build: ../services
    restart: unless-stopped
    command: ["npx", "tsx", "src/api/server.ts"]
    # No signer file. The api holds no signing key; a live process refuses to start
    # if one is present in its environment.
    env_file: ../services/.env
    environment:
      DATABASE_URL: postgres://hakky:hakky@postgres:5432/hakky
      SERVICE_ROLE: api
    ports:
      - "8080:8080" # direct access for verification; Caddy fronts it on 443
    depends_on:
      postgres:
        condition: service_healthy

  # Reserve-oracle keeper: demo stub or confirmed Bitcoin Core custody UTXOs.
  reserve-oracle:
    build: ../services
    restart: unless-stopped
    command: ["npx", "tsx", "src/reserve-oracle/cron.ts"]
    env_file:
      - ../services/.env
      - ../services/.env.reserve-oracle
    environment:
      DATABASE_URL: postgres://hakky:hakky@postgres:5432/hakky
      SERVICE_ROLE: reserve-oracle
    depends_on:
      postgres:
        condition: service_healthy

  # Attestation service: HTTP screen+attest (fronted by Caddy at /screen).
  attestation:
    build: ../services
    restart: unless-stopped
    command: ["npx", "tsx", "src/attestation/worker.ts"]
    env_file:
      - ../services/.env
      - ../services/.env.attestation
    environment:
      DATABASE_URL: postgres://hakky:hakky@postgres:5432/hakky
      SERVICE_ROLE: attestation
    # No host port — Caddy reaches it as attestation:8081 on the compose network.
    depends_on:
      postgres:
        condition: service_healthy

  # Orchestrator: verified deposit->mint + durable redemption index/settlement verification.
  orchestrator:
    build: ../services
    restart: unless-stopped
    command: ["npx", "tsx", "src/orchestrator/worker.ts"]
    env_file:
      - ../services/.env
      - ../services/.env.orchestrator
    environment:
      DATABASE_URL: postgres://hakky:hakky@postgres:5432/hakky
      SERVICE_ROLE: orchestrator
    # No host port — Caddy reaches it as orchestrator:8082 on the compose network.
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - attestation
      - orchestrator

volumes:
  pgdata:
  caddy_data:
  caddy_config:
