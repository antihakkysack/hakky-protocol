name: services

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "provision/**"
      - ".github/workflows/services.yml"
  pull_request:
    paths:
      - "services/**"
      - "provision/**"
      - ".github/workflows/services.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hakky
          POSTGRES_PASSWORD: hakky
          POSTGRES_DB: hakky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hakky"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://hakky:hakky@localhost:5432/hakky
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Run service tests
        run: npm test

      - name: Test durable Postgres state
        run: npm run test:db

      - name: Validate production Compose file
        working-directory: .
        run: |
          cp services/.env.example services/.env
          # Each write service reads its own gitignored signer file, so the API
          # container never holds another role's key. Compose needs them to exist to
          # validate the topology; the real files are injected from a secret manager.
          : > services/.env.attestation
          : > services/.env.reserve-oracle
          : > services/.env.orchestrator
          docker compose -f provision/docker-compose.yml config --quiet
